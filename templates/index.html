<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #FDF6F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .wrapper {
            width: 100%;
            max-width: 580px;
        }

        .header {
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            background: #FAC775;
            color: #412402;
            border-radius: 20px;
            padding: 3px 12px;
            margin-bottom: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            font-weight: 500;
            color: #2C2C2A;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .tagline {
            font-size: 14px;
            color: #5F5E5A;
            line-height: 1.6;
        }

        .card {
            background: white;
            border-radius: 16px;
            border: 0.5px solid #D3D1C7;
            padding: 28px;
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 500;
            color: #854F0B;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        .upload-zone {
            border: 1.5px dashed #FAC775;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            background: #FAEEDA;
            margin-bottom: 6px;
            transition: background 0.2s;
        }

        .upload-zone:hover { background: #FAC775; }

        .upload-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 13px;
            color: #633806;
            margin-bottom: 8px;
        }

        .upload-zone input[type="file"] {
            font-size: 12px;
            color: #854F0B;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #D3D1C7;
            border-radius: 10px;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            resize: vertical;
            outline: none;
            color: #2C2C2A;
            background: #FAFAF9;
            transition: border-color 0.2s;
            min-height: 140px;
        }

        textarea:focus { border-color: #EF9F27; background: white; }

        textarea::placeholder { color: #B4B2A9; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #D85A30;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 0.02em;
        }

        .submit-btn:hover { background: #993C1D; }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #B4B2A9;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="badge">Free Tool</div>
            <h1>Resume Analyser</h1>
            <p class="tagline">Upload your resume and paste a job description — get your match score and missing keywords instantly.</p>
        </div>

        <form action="/analyse" method="POST" enctype="multipart/form-data">
            <div class="card">
                <div class="section-label">Step 1 — Upload Resume</div>
                <div class="upload-zone">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Choose your resume PDF</div>
                    <input type="file" name="resume" accept=".pdf" required>
                </div>
            </div>

            <div class="card">
                <div class="section-label">Step 2 — Paste Job Description</div>
                <textarea name="job_desc" placeholder="Paste the full job description here — requirements, skills, responsibilities..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Analyse My Resume →</button>
        </form>

        <p class="footer-note">Built with Flask + Python · Your resume is never stored permanently</p>
    </div>
</body>
</html>
